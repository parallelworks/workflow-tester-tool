name: Run PROBE

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform host'
        required: true
        type: choice
        options:
          - activate.parallel.works
          - activate.hpc.mil
      workflow_name:
        description: 'Registered PROBE workflow name on the platform'
        required: true
        default: 'probe'
        type: string
      resource:
        description: 'Resource PROBE runs on (e.g. pw://alvaro/user-workspace)'
        required: true
        default: 'pw://alvaro/user-workspace'
        type: string
      tests_repo:
        description: 'Repository holding the test definitions'
        required: false
        default: 'https://github.com/parallelworks/workflow-tester-tool.git'
        type: string
      tests_branch:
        description: 'Branch of the tests repository'
        required: false
        default: 'main'
        type: string
      tests_directory:
        description: 'Directory of test definitions inside the repository'
        required: false
        default: 'tests'
        type: string
      filter:
        description: 'Optional test id filter (substring or glob)'
        required: false
        default: ''
        type: string
      bucket:
        description: 'Results bucket URI (empty keeps results only for the life of the run)'
        required: false
        default: 'pw://alvaro/gcpbucket'
        type: string
      bucket_path:
        description: 'Path inside the bucket'
        required: false
        default: 'probe/results'
        type: string
      interval_hours:
        description: 'Repeat the suite every N hours (0 = once)'
        required: false
        default: '0'
        type: string
      run_tests:
        description: 'Run the tests'
        required: false
        default: true
        type: boolean
      serve_dashboard:
        description: 'Serve the dashboard'
        required: false
        default: true
        type: boolean

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    env:
      PW_PLATFORM_HOST: ${{ inputs.platform }}
    steps:
      - name: Install pw CLI
        run: |
          case "$(uname -m)" in
            x86_64)  arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::Unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          mkdir -p ~/bin
          wget -q "https://${PW_PLATFORM_HOST}/cli/pw-linux-${arch}" -O ~/bin/pw
          chmod +x ~/bin/pw
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Authenticate pw CLI
        env:
          PW_API_KEY: ${{ inputs.platform == 'activate.parallel.works' && secrets.ACTIVATE_PARALLEL_WORKS || secrets.ACTIVATE_HPC_MIL }}
        run: pw auth apikey "$PW_API_KEY"

      - name: Create inputs.json
        run: |
          python3 - <<'EOF'
          import json, os
          bucket = "${{ inputs.bucket }}".strip()
          inputs = {
              "resource": "${{ inputs.resource }}",
              "tests": {"repo": "${{ inputs.tests_repo }}", "branch": "${{ inputs.tests_branch }}",
                        "directory": "${{ inputs.tests_directory }}"},
              "filter": "${{ inputs.filter }}",
              "results": {"path": "${{ inputs.bucket_path }}"},
              "schedule": {"interval_hours": int("${{ inputs.interval_hours }}" or 0)},
              "run_tests": ${{ inputs.run_tests }},
              "serve_dashboard": ${{ inputs.serve_dashboard }},
              "admin_dashboard": ${{ inputs.serve_dashboard }},
          }
          if bucket:
              inputs["results"]["bucket"] = bucket
          json.dump(inputs, open("inputs.json", "w"), indent=2)
          print(json.dumps(inputs, indent=2))
          EOF

      - name: Run PROBE
        run: |
          pw workflows run --trust \
            --name "ci: ${{ github.workflow }} #${{ github.run_number }}" \
            -i inputs.json \
            "${{ inputs.workflow_name }}"
