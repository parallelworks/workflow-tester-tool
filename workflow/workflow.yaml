# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'
env:
  PW_PLATFORM_HOST: ${{ env.PW_PLATFORM_HOST }}
  PW_USER: ${{ env.PW_USER }}
  PW_API_KEY: ${{ env.PW_API_KEY }}
sessions:
  dashboard:
    redirect: true
  admin:
    redirect: false
jobs:
  setup:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: https://github.com/parallelworks/workflow-tester-tool.git
          branch: main
      - name: Checkout tests
        run: |
          set -x
          cd ${PW_PARENT_JOB_DIR}

          # The test definitions may live in a different repo/branch/directory
          # than this tool (see the "Test Source" form inputs). Fetch only the
          # configured directory (sparse checkout) and normalise it into
          #   tests/<platform>/<user>/<kind>/<workflow>/<test>.json
          # so run_tests.py / serve.py see the platform-keyed tree they expect.
          REPO="${{ inputs.tests.repo }}"
          BRANCH="${{ inputs.tests.branch }}"

          # Directory within the repo holding the tests. Defaults to the literal
          # ${PW_PLATFORM_HOST}, which the shell expands here to the live host.
          DIR="${{ inputs.tests.directory }}"
          DIR="${DIR#https://}"; DIR="${DIR#http://}"; DIR="${DIR%/}"

          # Platform host the dashboard groups results under (scheme-stripped).
          PLATFORM="${PW_PLATFORM_HOST#https://}"; PLATFORM="${PLATFORM#http://}"
          PLATFORM="${PLATFORM%%/*}"
          DIR="${DIR:-$PLATFORM}"

          echo "::notice::Fetching tests from ${REPO}@${BRANCH} (dir: ${DIR})"

          rm -rf tests-src tests
          # Blobless, sparse clone: only the configured directory is materialised,
          # and Git-LFS blobs (e.g. interactive_session/downloads) are never pulled.
          export GIT_LFS_SKIP_SMUDGE=1
          git clone -q --no-checkout --depth 1 --filter=blob:none \
            --branch "${BRANCH}" "${REPO}" tests-src
          ( cd tests-src
            git sparse-checkout init --no-cone
            git sparse-checkout set "${DIR}"
            git checkout -q )

          mkdir -p "tests/${PLATFORM}"
          if [ -d "tests-src/${DIR}" ]; then
            cp -a "tests-src/${DIR}/." "tests/${PLATFORM}/"
            echo "::notice::Tests staged under tests/${PLATFORM}"
          else
            echo "::warning::Directory '${DIR}' not found in ${REPO}@${BRANCH} — no tests to run"
          fi
      - name: Get Session Ports
        if: ${{ inputs.serve_dashboard }}
        run: |
          SESSION_PORT=$(pw agent open-port)
          echo "SESSION_PORT=${SESSION_PORT}" | tee -a $OUTPUTS
          ADMIN_PORT=$(pw agent open-port)
          echo "ADMIN_PORT=${ADMIN_PORT}" | tee -a $OUTPUTS
      - name: Restore outputs from bucket
        run: |
          BUCKET_PATH="${{ inputs.bucket.uri }}/${{ inputs.bucket_path }}"
          rm -rf output
          pw buckets cp -r "${BUCKET_PATH}/" output/ \
            && echo "::notice::Outputs restored from ${BUCKET_PATH}" \
            || echo "::warning::No outputs found at ${BUCKET_PATH} — starting fresh"
  run_tests:
    if: ${{ inputs.run_tests }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Run Tests
        run: |
          set -x
          echo "PW_PLATFORM_HOST=${PW_PLATFORM_HOST:-NOT_SET}"
          echo "PW_USER=${PW_USER:-NOT_SET}"
          export PATH=$HOME/pw:$PATH
          cd ${PW_PARENT_JOB_DIR}

          # Log current cluster states up front — makes "why was this skipped?"
          # answerable straight from the job log.
          echo "::group::Cluster states"
          pw --platform-host "${PW_PLATFORM_HOST}" cluster ls -o table || true
          echo "::endgroup::"

          # Test failures are data, not workflow failures: never let a non-zero
          # exit fail this job, or the serve_* jobs would be early-cancelled and
          # the dashboards would never come up.
          python3 -u run_tests.py \
            --platform "${PW_PLATFORM_HOST}" \
            --user "${PW_USER}" \
            --tests-dir "${PW_PARENT_JOB_DIR}/tests" \
            --output-dir "${PW_PARENT_JOB_DIR}/output" \
            || echo "::warning::run_tests.py exited non-zero — see the dashboard for failing tests"
      - name: Transfer outputs to bucket
        if: ${{ always }}
        run: |
          pw buckets cp -r "${PW_PARENT_JOB_DIR}/output" ${{ inputs.bucket.uri }}/${{ inputs.bucket_path }}
  serve:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Start Dashboard
        early-cancel: any-job-failed
        run: |
          export PW_BASE_PATH=/me/session/${PW_USER}/${{ sessions.dashboard }}
          python3 serve.py \
            --port ${{ needs.setup.outputs.SESSION_PORT }} \
            --tests-dir ${PW_PARENT_JOB_DIR}/tests \
            --output-dir ${PW_PARENT_JOB_DIR}/output &
          echo $! > ${PW_PARENT_JOB_DIR}/service.pid
          sleep inf
        cleanup: |
          pid=$(cat ${PW_PARENT_JOB_DIR}/service.pid 2>/dev/null)
          [ -n "${pid}" ] && kill "${pid}" 2>/dev/null || true
  serve_admin:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Start Admin Dashboard
        early-cancel: any-job-failed
        run: |
          export PW_BASE_PATH=/me/session/${PW_USER}/${{ sessions.admin }}
          python3 serve.py \
            --port ${{ needs.setup.outputs.ADMIN_PORT }} \
            --tests-dir ${PW_PARENT_JOB_DIR}/tests \
            --output-dir ${PW_PARENT_JOB_DIR}/output \
            --admin &
          echo $! > ${PW_PARENT_JOB_DIR}/admin.pid
          sleep inf
        cleanup: |
          pid=$(cat ${PW_PARENT_JOB_DIR}/admin.pid 2>/dev/null)
          [ -n "${pid}" ] && kill "${pid}" 2>/dev/null || true
  create_session:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Create DashboardSession
        early-cancel: any-job-failed
        uses: parallelworks/update-session
        with:
          target: ${{ inputs.resource.id }}
          name: ${{ sessions.dashboard }}
          remoteHost: 0.0.0.0
          remotePort: ${{ needs.setup.outputs.SESSION_PORT }}
  create_session_admin:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Create AdminSession
        early-cancel: any-job-failed
        uses: parallelworks/update-session
        with:
          target: ${{ inputs.resource.id }}
          name: ${{ sessions.admin }}
          remoteHost: 0.0.0.0
          remotePort: ${{ needs.setup.outputs.ADMIN_PORT }}
'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        include-workspace: true
        tooltip: |
          Resource to run tests on and host the dashboard.
          Use the user workspace or the login node of any connected cluster.
      bucket:
        type: bucket
        label: Output Storage Bucket
        tooltip: |
          Bucket where test results are stored between runs.
          Existing results are restored from the bucket at startup;
          new results are uploaded after the test run completes.
      bucket_path:
        type: string
        label: Output Path in Bucket
        default: workflow-tester-tool/output
        tooltip: |
          Full path to the output directory inside the bucket.
          Results are saved as path/platform/user/...
      tests:
        type: group
        label: Test Source
        tooltip: |
          Where the test definitions live. Tests can be stored in a repository
          separate from this tool.
        items:
          repo:
            type: string
            label: Tests Repository
            default: https://github.com/parallelworks/workflow-tester-tool.git
            tooltip: |
              Git repository holding the test definitions.
          branch:
            type: string
            label: Tests Branch
            default: main
            tooltip: |
              Branch to check out from the tests repository.
          directory:
            type: string
            label: Tests Directory
            default: ${PW_PLATFORM_HOST}
            tooltip: |
              Directory within the repository that holds the test tree
              (<user>/<kind>/<workflow>/<test>.json). Defaults to the current
              platform host (e.g. activate.parallel.works), which is how this
              tool's own tests are organised.
      run_tests:
        type: boolean
        label: Run Tests
        default: true
        tooltip: |
          Yes → Run all workflow and session tests matching the current user
                and platform, then upload results to the bucket.
          No  → Skip test execution; useful when serving a dashboard of
                previously stored results.
      serve_dashboard:
        type: boolean
        label: Serve Dashboard
        default: true
        tooltip: |
          Yes → Start the public and admin test-results dashboards as interactive sessions.
          No  → Run tests in batch mode only, with no web interface.
