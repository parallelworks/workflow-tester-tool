# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
permissions:
  - '*'

env:
  PW_PLATFORM_HOST: ${{ env.PW_PLATFORM_HOST }}
  PW_USER: ${{ env.PW_USER }}
  PW_API_KEY: ${{ env.PW_API_KEY }}

sessions:
  dashboard:
    redirect: true

jobs:
  setup:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout
        uses: parallelworks/checkout
        with:
          repo: git@github.com:parallelworks/workflow-tester-tool.git
          branch: add-activate-workflow
      - name: Get Session Port
        if: ${{ inputs.serve_dashboard }}
        run: |
          SESSION_PORT=$(pw agent open-port)
          echo "SESSION_PORT=${SESSION_PORT}" | tee -a $OUTPUTS
      - name: Restore outputs from bucket
        run: |
          echo "::group::Restore outputs from bucket"
          BUCKET_PATH="${{ inputs.bucket.uri }}/${{ inputs.bucket_path }}/output"
          echo "::notice::Checking bucket path: ${BUCKET_PATH}"

          if ! pw buckets ls "${BUCKET_PATH}" > /dev/null 2>&1; then
            echo "::warning::${BUCKET_PATH} not found in bucket — skipping restore (expected on first run)"
            echo "::endgroup::"
            exit 0
          fi

          echo "::notice::Restoring from ${BUCKET_PATH}"
          rm -rf output
          pw buckets cp -r "${BUCKET_PATH}" .

          echo "::notice::Validating output directory structure"
          expected="output/${PW_PLATFORM_HOST}/${PW_USER}"
          if [ ! -d "${expected}" ]; then
            echo "::error title=Invalid bucket structure::Expected output/${PW_PLATFORM_HOST}/${PW_USER}/ not found. Actual structure:"
            find output -maxdepth 3 -type d 2>/dev/null | sed 's/^/  /'
            echo "::endgroup::"
            exit 1
          fi

          echo "::notice::Restore complete — ${expected}/"
          echo "::endgroup::"

  run_tests:
    if: ${{ inputs.run_tests }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Run Tests
        early-cancel: any-job-failed
        run: |
          set -x
          echo "PW_PLATFORM_HOST=${PW_PLATFORM_HOST:-NOT_SET}"
          echo "PW_USER=${PW_USER:-NOT_SET}"
          export PATH=$HOME/pw:$PATH
          cd ${PW_PARENT_JOB_DIR}
          python3 -u run_tests.py \
            --platform "${PW_PLATFORM_HOST}" \
            --user "${PW_USER}"
      - name: Transfer outputs to bucket
        run: |
          pw buckets cp -r output ${{ inputs.bucket.uri }}/${{ inputs.bucket_path }}/output

  serve:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Start Dashboard
        early-cancel: any-job-failed
        run: |
          export PW_BASE_PATH=/me/session/${PW_USER}/${{ sessions.dashboard }}
          python3 serve.py \
            --port ${{ needs.setup.outputs.SESSION_PORT }} \
            --output-dir ${PW_PARENT_JOB_DIR}/output/${PW_PLATFORM_HOST} &
          echo $! > ${PW_PARENT_JOB_DIR}/service.pid
          sleep inf
        cleanup: |
          pid=$(cat ${PW_PARENT_JOB_DIR}/service.pid 2>/dev/null)
          [ -n "${pid}" ] && kill "${pid}" 2>/dev/null || true


  create_session:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Create DashboardSession
        early-cancel: any-job-failed
        uses: parallelworks/update-session
        with:
          target: ${{ inputs.resource.id }}
          name: ${{ sessions.dashboard }}
          remoteHost: 0.0.0.0
          remotePort: ${{ needs.setup.outputs.SESSION_PORT }}


'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        include-workspace: true
        tooltip: |
          Resource to run tests on and host the dashboard.
          Use the user workspace or the login node of any connected cluster.
      bucket:
        type: bucket
        label: Output Storage Bucket
        tooltip: |
          Bucket where test results are stored between runs.
          Existing results are restored from the bucket at startup;
          new results are uploaded after the test run completes.
      bucket_path:
        type: string
        label: Path in Bucket
        default: workflow-tester-tool
        tooltip: |
          Path inside the bucket where test outputs are stored and retrieved.
          Results are saved as <path>/output/<platform>/<user>/...
      run_tests:
        type: boolean
        label: Run Tests
        default: true
        tooltip: |
          Yes → Run all workflow and session tests matching the current user
                and platform, then upload results to the bucket.
          No  → Skip test execution; useful when serving a dashboard of
                previously stored results.
      serve_dashboard:
        type: boolean
        label: Serve Dashboard
        default: true
        tooltip: |
          Yes → Start the test results dashboard as an interactive session.
          No  → Run tests in batch mode only, with no web interface.
