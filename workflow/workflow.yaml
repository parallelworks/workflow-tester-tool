# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# PROBE: runs the compatibility tests defined for this platform and user, keeps
# their results in a bucket, and serves the compatibility dashboard through pw
# endpoints for as long as this run lives. Cancel the run to take it down.
permissions:
  - '*'
env:
  PW_PLATFORM_HOST: ${{ env.PW_PLATFORM_HOST }}
  PW_USER: ${{ env.PW_USER }}
  PW_API_KEY: ${{ env.PW_API_KEY }}
jobs:
  setup:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout PROBE
        uses: parallelworks/checkout
        with:
          repo: ${{ inputs.code.repo }}
          branch: ${{ inputs.code.branch }}
      - name: Fetch test definitions
        run: |
          set -eo pipefail
          cd ${PW_PARENT_JOB_DIR}
          REPO="${{ inputs.tests.repo }}"
          BRANCH="${{ inputs.tests.branch }}"
          DIR="${{ inputs.tests.directory }}"
          DIR="${DIR#/}"; DIR="${DIR%/}"; DIR="${DIR:-tests}"
          echo "::notice::Fetching test definitions from ${REPO}@${BRANCH} (directory ${DIR})"
          rm -rf tests-src tests
          export GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1
          git clone -q --no-checkout --depth 1 --filter=blob:none --branch "${BRANCH}" "${REPO}" tests-src
          ( cd tests-src
            git sparse-checkout init --no-cone
            git sparse-checkout set "${DIR}"
            git checkout -q )
          if [ ! -d "tests-src/${DIR}" ]; then
            echo "::error::Directory '${DIR}' not found in ${REPO}@${BRANCH}"
            exit 1
          fi
          mkdir -p tests
          cp -a "tests-src/${DIR}/." tests/
          rm -rf tests-src
          echo "::notice::$(find tests -name '*.json' | wc -l) test definition file(s) staged"
          python3 -m probe list --tests tests --platform "${PW_PLATFORM_HOST}" --user "${PW_USER}" || echo "::warning::Some test definitions are invalid; see above"
      - name: Restore results
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          BUCKET="${{ inputs.results.bucket.uri }}"
          BUCKET_PATH="${{ inputs.results.path }}"
          mkdir -p results
          case "${BUCKET}" in
            ''|undefined|pw://) echo "::notice::No results bucket configured; results stay in ${PW_PARENT_JOB_DIR}/results for the life of this run" ;;
            *)
              pw buckets cp -r "${BUCKET}/${BUCKET_PATH#/}/" results/ \
                && echo "::notice::Results restored from ${BUCKET}/${BUCKET_PATH#/}" \
                || echo "::warning::Nothing restored from ${BUCKET}/${BUCKET_PATH#/}; starting with an empty results tree" ;;
          esac
  run:
    if: ${{ inputs.run_tests }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Run the suite
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          BUCKET="${{ inputs.results.bucket.uri }}"
          BUCKET_PATH="${{ inputs.results.path }}"
          INTERVAL="${{ inputs.schedule.interval_hours }}"
          FILTER="${{ inputs.filter }}"
          case "${FILTER}" in ''|undefined) FILTER_ARGS="" ;; *) FILTER_ARGS="--filter ${FILTER}" ;; esac
          case "${INTERVAL}" in ''|undefined) INTERVAL=0 ;; esac
          sync_results() {
            case "${BUCKET}" in
              ''|undefined|pw://) ;;
              *) pw buckets cp -r results/ "${BUCKET}/${BUCKET_PATH#/}/" \
                   && echo "::notice::Results synced to ${BUCKET}/${BUCKET_PATH#/}" \
                   || echo "::warning::Results sync to ${BUCKET}/${BUCKET_PATH#/} failed" ;;
            esac
          }
          while :; do
            echo "::group::PROBE suite $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Test failures are data, not workflow failures: the job stays green so
            # the dashboard keeps serving them.
            python3 -u -m probe run --tests tests --results results ${FILTER_ARGS} \
              || echo "::warning::probe run exited $? (failing tests or invalid definitions); see the dashboard"
            echo "::endgroup::"
            sync_results
            [ "${INTERVAL}" -gt 0 ] 2>/dev/null || break
            echo "::notice::Next suite run in ${INTERVAL} hour(s)"
            sleep $(( INTERVAL * 3600 ))
          done
  serve:
    if: ${{ inputs.serve_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the dashboard
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          echo "::notice::Dashboard endpoint probe-${PW_RUN_SLUG}"
          pw endpoints run --name probe-${PW_RUN_SLUG} -o text -- \
            python3 -u -m probe serve --port {port} --prefix {path} --results results --tests tests
  serve_admin:
    if: ${{ inputs.serve_dashboard && inputs.admin_dashboard }}
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the admin dashboard
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          echo "::notice::Admin dashboard endpoint probe-admin-${PW_RUN_SLUG}"
          pw endpoints run --name probe-admin-${PW_RUN_SLUG} -o text -- \
            python3 -u -m probe serve --admin --port {port} --prefix {path} --results results --tests tests
'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        include-workspace: true
        tooltip: |
          Where PROBE itself runs: the user workspace or the login node of a
          connected cluster. It launches the tests from here with the pw CLI and
          hosts the dashboard.
      tests:
        type: group
        label: Test definitions
        tooltip: Git repository, branch and directory holding the test definition files.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/workflow-tester-tool.git
            tooltip: Git URL of the repository that holds the test definitions.
          branch:
            type: string
            label: Branch
            default: main
          directory:
            type: string
            label: Directory
            default: tests
            tooltip: |
              Directory inside the repository. Every *.json file below it is a
              test definition; only the ones whose platform and user match this
              run are executed.
      filter:
        type: string
        label: Test filter
        optional: true
        default: ''
        tooltip: |
          Optional. Only run tests whose id (<platform>/<user>/<workflow_name>/<test>)
          contains this text or matches this glob, e.g. jupyterlab or */jean-*.
      results:
        type: group
        label: Results
        tooltip: Results are restored from this bucket before the suite and synced back after it.
        items:
          bucket:
            type: bucket
            label: Bucket
            optional: true
            tooltip: Leave empty to keep results only for the life of this run.
          path:
            type: string
            label: Path in bucket
            default: probe/results
      schedule:
        type: group
        label: Schedule
        items:
          interval_hours:
            type: number
            label: Repeat every (hours)
            default: 0
            min: 0
            tooltip: |
              0 runs the suite once. A positive number repeats it every that many
              hours for as long as this run lives; the dashboard stays up in between.
      run_tests:
        type: boolean
        label: Run tests
        default: true
        tooltip: No serves the dashboard of previously stored results without running anything.
      serve_dashboard:
        type: boolean
        label: Serve dashboard
        default: true
        tooltip: Yes registers the dashboard as endpoint probe-<run slug>. It lives until this run is canceled.
      admin_dashboard:
        type: boolean
        label: Serve admin dashboard
        default: true
        hidden: ${{ inputs.serve_dashboard == false }}
        tooltip: Yes also registers probe-admin-<run slug>, where tests can be rerun or their runs canceled.
      code:
        type: group
        label: PROBE code
        tooltip: Where the PROBE runner and dashboard code is fetched from.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/workflow-tester-tool.git
          branch:
            type: string
            label: Branch
            default: main
