# yaml-language-server: $schema=https://activate.parallel.works/workflow.schema.json
# PROBE: serves the compatibility dashboards for this platform and user. Tests are
# run from the admin dashboard; every test's results go to the bucket as soon as it
# finishes. The run lives until it is canceled.
permissions:
  - '*'
env:
  PW_PLATFORM_HOST: ${{ env.PW_PLATFORM_HOST }}
  PW_USER: ${{ env.PW_USER }}
  PW_API_KEY: ${{ env.PW_API_KEY }}
jobs:
  setup:
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Checkout PROBE
        uses: parallelworks/checkout
        with:
          repo: ${{ inputs.code.repo }}
          branch: ${{ inputs.code.branch }}
      - name: Fetch test definitions
        run: |
          set -eo pipefail
          cd ${PW_PARENT_JOB_DIR}
          REPO="${{ inputs.tests.repo }}"
          BRANCH="${{ inputs.tests.branch }}"
          DIR="${{ inputs.tests.directory }}"
          DIR="${DIR#/}"; DIR="${DIR%/}"; DIR="${DIR:-tests}"
          echo "::notice::Fetching test definitions from ${REPO}@${BRANCH} (directory ${DIR})"
          rm -rf tests-src tests
          export GIT_TERMINAL_PROMPT=0 GIT_LFS_SKIP_SMUDGE=1
          git clone -q --no-checkout --depth 1 --filter=blob:none --branch "${BRANCH}" "${REPO}" tests-src
          ( cd tests-src
            git sparse-checkout init --no-cone
            git sparse-checkout set "${DIR}"
            git checkout -q )
          if [ ! -d "tests-src/${DIR}" ]; then
            echo "::error::Directory '${DIR}' not found in ${REPO}@${BRANCH}"
            exit 1
          fi
          mkdir -p tests
          cp -a "tests-src/${DIR}/." tests/
          rm -rf tests-src
          echo "::notice::$(find tests -name '*.json' | wc -l) test definition file(s) staged"
          python3 -m probe list --tests tests --platform "${PW_PLATFORM_HOST}" --user "${PW_USER}" \
            || echo "::warning::Some test definitions are invalid; see above"
      - name: Restore results from the bucket
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          BUCKET="${{ inputs.results.bucket.uri }}"
          case "${BUCKET}" in
            ''|undefined|pw://) echo "::error::A results bucket is required"; exit 1 ;;
          esac
          RESULTS="${BUCKET%/}/${{ inputs.results.path }}"
          RESULTS="${RESULTS%/}"
          mkdir -p results
          if out=$(pw buckets cp -r "${RESULTS}/" results/ 2>&1); then
            echo "::notice::Results restored from ${RESULTS}"
          elif echo "${out}" | grep -q "no objects found"; then
            echo "::notice::No results yet at ${RESULTS}"
          else
            echo "${out}"
            echo "::error::Could not restore results from ${RESULTS}"
            exit 1
          fi
  dashboard:
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the dashboard
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          RESULTS="${{ inputs.results.bucket.uri }}"; RESULTS="${RESULTS%/}/${{ inputs.results.path }}"
          echo "::notice::Dashboard endpoint probe-${PW_RUN_SLUG}"
          pw endpoints run --name probe-${PW_RUN_SLUG} -o text -- \
            python3 -u -m probe serve --port {port} --prefix {path} --results results --tests tests --bucket "${RESULTS%/}"
  admin_dashboard:
    needs:
      - setup
    ssh:
      remoteHost: ${{ inputs.resource.ip }}
    steps:
      - name: Serve the admin dashboard
        run: |
          cd ${PW_PARENT_JOB_DIR}
          export PATH=$HOME/pw:$PATH
          RESULTS="${{ inputs.results.bucket.uri }}"; RESULTS="${RESULTS%/}/${{ inputs.results.path }}"
          echo "::notice::Admin dashboard endpoint probe-admin-${PW_RUN_SLUG}"
          pw endpoints run --name probe-admin-${PW_RUN_SLUG} -o text -- \
            python3 -u -m probe serve --admin --port {port} --prefix {path} --results results --tests tests --bucket "${RESULTS%/}"
'on':
  execute:
    inputs:
      resource:
        type: compute-clusters
        label: Resource
        include-workspace: true
        tooltip: |
          Where PROBE runs: the user workspace or the login node of a connected
          cluster. Tests are launched from here with the pw CLI.
      tests:
        type: group
        label: Test definitions
        tooltip: Git repository, branch and directory of the test definition files.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/workflow-tester-tool.git
          branch:
            type: string
            label: Branch
            default: main
          directory:
            type: string
            label: Directory
            default: tests
            tooltip: |
              Every *.json file below this directory is a test definition. Only the
              ones whose platform and user match this run can be executed.
      results:
        type: group
        label: Results
        tooltip: |
          The bucket holds the results. They are restored when the run starts
          and updated after every test.
        items:
          bucket:
            type: bucket
            label: Bucket
          path:
            type: string
            label: Path in bucket
            default: probe/results
      code:
        type: group
        label: PROBE code
        tooltip: Where the runner and dashboard code is fetched from.
        items:
          repo:
            type: string
            label: Repository
            default: https://github.com/parallelworks/workflow-tester-tool.git
          branch:
            type: string
            label: Branch
            default: main
